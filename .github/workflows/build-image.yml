name: build-image

# Uji, bangun image dan kirim ke GHCR; push ke main lalu otomatis deploy ke VPS (job `deploy`).
# Deploy memakai kunci SSH khusus yang di VPS hanya boleh menjalankan deploy/deploy-hook.sh (lihat deploy/README.md).
# Branch lain hanya menguji dan membangun image; deploy manual: ./deploy.sh sha-xxxxxxx di VPS.
on:
  push:
    branches: [main, "feat/**", "deploy/**"]
    tags: ["v*", "kp-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Tes backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck dan build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  image:
    needs: test
    # Pull request hanya menguji; image dibangun untuk main, tag, dan manual.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Hanya push ke main. Satu deploy pada satu waktu; deploy yang sedang jalan tidak dibatalkan.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy ke VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Tag image = 7 huruf pertama SHA commit, sama dengan tag dari docker/metadata-action di job image.
          # Perintah di sisi server ditentukan authorized_keys (deploy-hook.sh); argumen ini hanya tag-nya.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "sha-${GITHUB_SHA::7}"
